name: Build DaroYar APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # App stores require versionCode to increase with every uploaded update.
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

      - name: Build debug APK (installable for testing)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      # Turns Kotlin compiler errors and failed tests into annotations on the run page.
      - name: Report build errors
        if: failure()
        run: |
          cat gradle-*.log 2>/dev/null | grep -E '^e: |FAILED$|What went wrong' -A1 | head -n 40 | while IFS= read -r line; do
            [ -n "$line" ] && [ "$line" != "--" ] && echo "::error::${line}"
          done

      # ---------- Signed release APK (for Cafe Bazaar / Myket / sharing) ----------
      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 is not set, so no signed release APK is built (the debug APK is still produced)."
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "DAROYAR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: github.event_name != 'pull_request' && env.HAS_KEYSTORE == 'true'
        env:
          DAROYAR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DAROYAR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DAROYAR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify release signature (must not be the debug key)
        if: github.event_name != 'pull_request' && env.HAS_KEYSTORE == 'true'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK produced (check the signing secrets)."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/DaroYar-debug-${VERSION_NAME}.apk"
          if ls app/build/outputs/apk/release/*.apk 2>/dev/null | grep -v unsigned >/dev/null; then
            cp $(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n 1) "dist/DaroYar-${VERSION_NAME}.apk"
          fi
          ls -la dist

      - name: Upload release APK (signed; for stores and sharing)
        if: github.event_name != 'pull_request' && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: DaroYar-release-apk
          path: dist/DaroYar-1*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DaroYar-debug-apk
          path: dist/DaroYar-debug-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

